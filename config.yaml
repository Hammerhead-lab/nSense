# Single source of truth for every pipeline stage.
seed: 503

# Embedding model (e)
model_name: bert-base-uncased
model_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
layer: -1            # final hidden layer
pooling: mean        # mean of the span's subword token vectors
batch_size: 32

# Data (StereoSet intrasentence, validation split)
dataset_name: McGill-NLP/stereoset
dataset_config: intrasentence
dataset_split: validation
dataset_revision: bf6e7ce50491784d094fb7afe60a70ecccb89035
axes: [gender, race, religion]
axis_labels:
  race: race/nationality

# Evaluation
n_splits: 5          # CV folds on the dev set
test_n_splits: 5     # the test set is one fold of 5 (about 20%)

# Label granularity (RQ1): binary labels are derived from `class` at training time.
binary_map: {innate: bias, derived: bias, neutral: neutral}

# Random forest study (RQ2): every other parameter is the scikit-learn default.
rf_grid:
  n_estimators: [100, 300, 500]
  max_depth: [5, 10, 20, null]   # null = unlimited (the current setting)

# Conventional baselines on the span embeddings (three-class only), StandardScaler inside the pipeline.
lr_grid:
  C: [0.1, 1, 10]
knn_grid:
  n_neighbors: [1, 3, 5, 7, 9]

# Paths (relative to the project root)
paths:
  rows: data/rows.csv
  cross_axis_probe: data/cross_axis_probe.csv
  embeddings: data/embeddings.npy
  context_embeddings: data/context_embeddings.npy
  embeddings_meta: data/embeddings_meta.json
  results: results
  data_report: results/data_report.json
